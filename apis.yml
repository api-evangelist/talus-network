name: Talus Network
description: >-
  Talus Network is a decentralized Layer 1 platform for building and running
  autonomous, verifiable AI agents fully on-chain. Its core product, Nexus, is an
  agentic workflow engine that lets developers compose agents as directed acyclic
  graphs (DAGs) of reusable Tools — LLM calls, HTTP requests, storage, exchanges —
  executed and settled on-chain. Talus is built on Sui Move smart contracts with a
  Cosmos SDK / CometBFT Protochain node, and ships a developer surface as Rust crates
  (nexus-sdk, nexus-cli, nexus-toolkit), a Homebrew/AUR CLI, GitBook developer docs,
  and on-chain Move module API references. Backed by Polychain, Talus positions itself
  as infrastructure for the autonomous digital economy. There is no traditional REST /
  OpenAPI HTTP API; the platform is consumed through the SDK, CLI, and Move contracts.
